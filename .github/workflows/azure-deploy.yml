name: Build e deploy da API de vagas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-api-vaga-561584
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '11'
          cache: maven

      - name: Compilar e executar os testes
        run: mvn -B clean verify
        env:
          ORACLE_URL: ${{ secrets.ORACLE_URL }}
          ORACLE_USERNAME: ${{ secrets.ORACLE_USERNAME }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-vagas
          path: target/sprint3-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://api-vaga-561584.azurewebsites.net/vagas
    steps:
      - name: Baixar o JAR
        uses: actions/download-artifact@v4
        with:
          name: api-vagas
          path: artifact

      - name: Publicar no Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-vaga-561584
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifact/sprint3-0.0.1-SNAPSHOT.jar
